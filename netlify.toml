[build]
  command = "npm run build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "20"

# ── Static Assets (immutable) ──────────────────────────────────
[[headers]]
  for = "/_next/static/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/videos/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# ── Next.js Image Optimizer Cache ──────────────────────────────
[[headers]]
  for = "/_next/image*"
  [headers.values]
    Cache-Control = "public, max-age=86400, stale-while-revalidate=604800"

# ── API caching ────────────────────────────────────────────────
# API cache headers are set by the route handlers themselves via
# lib/http-cache.ts, which pairs Cache-Control with Netlify-Vary.
# Do NOT add Cache-Control for /api/* here: Netlify's CDN ignores
# query strings in its cache key unless Netlify-Vary declares them,
# so a bare Cache-Control serves one category's products to every
# category (the "clicked Dates, got Candy" bug).

